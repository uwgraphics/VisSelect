<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="/css/style.css">
        <script src="/js/d3.js"></script>
        <script type="module" src="/js/main.js"></script>
    </head>
    <body>
        <h1></h1>
        <section id="loadDataset">
            <h2>Load Dataset</h2>
            <input id="datasetInput" type="file">
            <button id="randomGeneration" type="button">
                Random generation
            </button>
            <p id="generatorControls" hidden>
                <select id="generator"></select>
                <span id="generatorSettings"></span>
                <button id="backToStart" type="button">Back</button>
                <button id="generateDataset" type="button">Generate</button>
            </p>
        </section>

        <h2>Dataset Information</h2>
        <p id="datasetInfo"></p>
        <p id="featureControls" hidden>
            <label>x: <select id="xFeature"></select></label>
            <label>y: <select id="yFeature"></select></label>
        </p>
        
        <h2>Define Selection</h2>
        <div class="panels">
            <div id="selectionControls" hidden>
                <div id="objectives"></div>
                <select id="addObjective">
                    <option disabled selected>Add objective</option>
                </select>

                <p>
                    <label>
                        Size
                        <input id="subsetSize" type="number" min="1" step="1">
                    </label>
                    <label>
                        Algorithm
                        <select id="algorithm"></select>
                    </label>
                    <span id="algorithmSettings"></span>
                </p>

                <button id="selectSubset" type="button" disabled>
                    Select Subset
                </button>
                <button id="stopSelection" type="button" hidden>Stop</button>
                <p id="selectionInfo"></p>
            </div>
            <div id="chart"></div>
            <div id="lossChart"></div>
        </div>
    </body>
</html>
