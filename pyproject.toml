[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "visselect"
version = "0.1.0"
description = "A Python package for designing subset selection for data visualization by blending visualization goals as composable objective functions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
test = ["pandas", "coverage"]
exact = ["gurobipy"]

[[project.authors]]
name = "Connor Bailey"
email = "cbbcbail@cs.wisc.edu"

[project.urls]
Repository = "https://github.com/uwgraphics/VisSelect"

[tool.setuptools.packages.find]
where = ["python"]

[tool.coverage.run]
source = ["python/visselect"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]